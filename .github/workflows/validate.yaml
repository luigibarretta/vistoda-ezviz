name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  provider-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch the exact provider kit from the public source of truth
        run: |
          git init .ci/vistoda-provider-kit
          git -C .ci/vistoda-provider-kit remote add origin https://git.luigibarretta.com/luigibarretta/lib-vistoda-provider-kit.git
          git -C .ci/vistoda-provider-kit fetch --depth=1 origin 4f6c74125a673cb9836471122ae0007938b86619
          git -C .ci/vistoda-provider-kit checkout --detach FETCH_HEAD
      - name: Verify exact bootstrap dependency and lifecycle
        run: |
          test "$(git -C .ci/vistoda-provider-kit rev-parse HEAD)" = "$(tr -d '[:space:]' < dependencies/vistoda-provider-kit.sha)"
          cmp .ci/vistoda-provider-kit/dist/vistoda-app-bootstrap.sh packaging/home-assistant/vistoda-app-bootstrap.sh
          sh .ci/vistoda-provider-kit/tests/bootstrap-test.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  quality:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      # Keep the product MSRV checks above on Rust 1.88, but run cargo-audit
      # with a current toolchain because audit-check compiles its own CLI.
      - uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e # 1.96.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image at the declared version
        # Runs on the same checkout as the tag-triggered release workflow.
        shell: bash
        run: |
          sh scripts/check-release.sh
          bash tests/release-preflight.sh
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "${version}"
          docker build \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg BUILD_ARCH=amd64 \
            --tag vistoda-ezviz-addon:test \
            --file packaging/home-assistant/Dockerfile \
            .
