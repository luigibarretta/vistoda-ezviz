name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

# Checks come from ci-local.json through the vendored ci-local runner, as in
# .gitea/workflows/ci.yaml; this workflow never repeats a manifest command
# (repo-tooling consumer contract). Plain steps are GitHub-only: checkouts,
# toolchains, caches, cargo-audit installation, gitleaks-action and the image
# build.
jobs:
  provider-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # provider-kit fetches lib-vistoda-provider-kit at
      # dependencies/vistoda-provider-kit.sha (dependencies/vendored.json).
      - name: Exact bootstrap dependency and kit lifecycle test
        run: node third_party/repo-tooling/ci-local.mjs --ci --only provider-kit,provider-kit-test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # repo-tooling-sync runs on Gitea only: the repo-tooling mirror on GitHub
      # is private, so this public workflow cannot check it out.
      # Same reachable mainline action commit as Gitea CI; version branches are rewritten upstream.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Vendored tooling, LOC and NASA ratchets, rustfmt and dependency audit
        run: node third_party/repo-tooling/ci-local.mjs --ci --only loc,nasa,source-languages,rust-fmt,audit-lockfiles
      - name: Clippy, ci-local job ownership and Rust tests
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-clippy,ci-local-jobs,rust-test

  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release identity and publication preflight
        run: node third_party/repo-tooling/ci-local.mjs --ci --only release-check
      - name: Build the app image at the declared version
        # Runs on the same checkout as the tag-triggered release workflow.
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "${version}"
          docker build \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg BUILD_ARCH=amd64 \
            --tag vistoda-ezviz-addon:test \
            --file packaging/home-assistant/Dockerfile \
            .
