name: publish-home-assistant-app

on:
  push:
    tags: ["v*"]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: vistoda-ezviz-addon

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yaml
    secrets: inherit
    permissions:
      contents: read
      checks: write
      issues: write

  init:
    needs: validation
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: bash
        run: echo "value=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Verify release tag
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "${REF_NAME}" = "v${VERSION}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${REF_NAME}^{commit}")"
      - name: Reject an existing immutable manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/assert-image-absent.sh "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" "${{ steps.version.outputs.value }}"
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject an existing immutable architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/assert-image-absent.sh "${{ matrix.image }}" "${{ needs.init.outputs.version }}"
      - uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: packaging/home-assistant/Dockerfile
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
      - name: Verify published platforms
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.init.outputs.version }}" | grep -F 'linux/amd64'
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.init.outputs.version }}" | grep -F 'linux/arm64'
      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          name="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          digest="$(docker buildx imagetools inspect "${name}:${{ needs.init.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "${digest}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-architecture digest
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub release metadata
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
