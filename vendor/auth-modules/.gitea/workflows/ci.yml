name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: lib-auth-modules-${{ github.ref }}
  cancel-in-progress: true

# Checks come from ci-local.json through the vendored ci-local runner, the same
# entry point used before a push (`node third_party/repo-tooling/ci-local.mjs
# --quick`, then the full gate). Every manifest step runs in exactly one call
# below. Plain workflow steps are CI-only: checkouts, toolchains, caches and
# tool installation.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # CI-only: the checkout of the commit pinned in
      # dependencies/repo-tooling.sha that the repo-tooling-sync step compares
      # third_party/repo-tooling with.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: luigibarretta/repo-tooling
          ref: b8ee6b7218d4d01c90403d1d24826006242a6a23
          path: vendor/repo-tooling
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31
        with:
          components: clippy, rustfmt
      - name: Install check tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep
      - name: Cache the pinned cargo-audit binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /root/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-linux-amd64
      - name: Install cargo-audit when absent from cache
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -q 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Repository tooling, LOC and NASA quality gates
        run: node third_party/repo-tooling/ci-local.mjs --ci --only repo-tooling-sync,loc,nasa
      # audit-lockfiles ignores the RustSec advisories without a fixed release
      # only through docs/vex/auth-modules.openvex.json (product
      # pkg:cargo/auth-modules).
      - name: Security contracts and dependency audit
        run: node third_party/repo-tooling/ci-local.mjs --ci --only auth-gold,lockfile,security-audit,audit-lockfiles
      - name: Rust format, check, lint and tests
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-fmt,rust-check,rust-clippy,rust-test
