[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ezviz-vtm-bridge"
version = "0.1.0"
description = "Bounded EZVIZ VTM/VTDU media bridge for Home Assistant and SceneTrove"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Luigi Barretta" }]
dependencies = [
  "aiohttp>=3.12.15,<4",
  "pyezvizapi==1.0.5.0",
]

[project.scripts]
ezviz-vtm-bridge = "ezviz_vtm_bridge.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12.8,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ezviz_vtm_bridge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=ezviz_vtm_bridge --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "T20", "UP", "W"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ezviz_vtm_bridge"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
