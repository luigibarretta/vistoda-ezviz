services:
  ezviz-vtm-bridge:
    build:
      context: ..
    image: vistoda-ezviz:local
    restart: unless-stopped
    read_only: true
    user: "${VISTODA_UID:-10001}:${VISTODA_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      EZVIZ_BRIDGE_CAMERAS_FILE: /config/cameras.json
      EZVIZ_BRIDGE_API_TOKEN_FILE: /run/secrets/api_token
      EZVIZ_BRIDGE_EZVIZ_TOKEN_FILE: /data/token.json
      EZVIZ_BRIDGE_DATA_DIR: /data
      EZVIZ_BRIDGE_MAX_LIVE_SESSION_SECONDS: "90"
      EZVIZ_BRIDGE_SNAPSHOT_CACHE: "120"
      EZVIZ_BRIDGE_SNAPSHOT_STALE: "900"
    secrets:
      - api_token
    volumes:
      - ../config:/config:ro
      - ../data:/data
    ports:
      - "127.0.0.1:8765:8765"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

secrets:
  api_token:
    file: ../secrets/api_token
