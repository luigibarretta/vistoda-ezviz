[package]
name = "ezviz-vtm-bridge"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luigi Barretta"]
description = "Vistoda connector for bounded EZVIZ VTM/VTDU media delivery"
license = "Apache-2.0"
repository = "https://git.luigibarretta.com/luigibarretta/vistoda-ezviz"

[lib]
name = "ezviz_vtm_bridge"
path = "src/lib.rs"

[[bin]]
name = "ezviz-vtm-bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "scenetrove-pull"
path = "src/bin/scenetrove_pull.rs"

[dependencies]
aes = "0.8"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1.10"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cipher = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1.7"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
significant_drop_tightening = "allow"
too_many_lines = "allow"
