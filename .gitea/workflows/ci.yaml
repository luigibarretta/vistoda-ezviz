name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luigibarretta/lib-vistoda-provider-kit
          ref: 4f6c74125a673cb9836471122ae0007938b86619
          path: .ci/vistoda-provider-kit
      - name: Verify pinned Vistoda provider kit
        run: |
          pin="$(tr -d '[:space:]' < dependencies/vistoda-provider-kit.sha)"
          test "${pin}" = "4f6c74125a673cb9836471122ae0007938b86619"
          test "$(git -C .ci/vistoda-provider-kit rev-parse HEAD)" = "${pin}"
          cmp .ci/vistoda-provider-kit/dist/vistoda-app-bootstrap.sh \
            packaging/home-assistant/vistoda-app-bootstrap.sh
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --test loc_budget
      - run: cargo test --locked --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - name: Build standalone image at the declared version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "${version}"
          docker build --build-arg "VERSION=${version}+ci" --build-arg REVISION=ci \
            --tag ezviz-vtm-bridge:test .
          test "$(docker image inspect ezviz-vtm-bridge:test \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" \
            = "${version}+ci"
      - run: >-
          docker run --rm --network none --read-only --user 10001:10001
          ezviz-vtm-bridge:test --version
      - run: ./tests/smoke-remux.sh ezviz-vtm-bridge:test
