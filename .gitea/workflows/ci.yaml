name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_loc.py
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - run: >-
          docker build --build-arg VERSION=0.1.0+ci --build-arg REVISION=ci
          --tag ezviz-vtm-bridge:test .
      - run: >-
          docker run --rm --network none --read-only --user 10001:10001
          --entrypoint python ezviz-vtm-bridge:test
          -c "import ezviz_vtm_bridge, aiohttp, pyezvizapi"
