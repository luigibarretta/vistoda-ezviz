name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: luigibarretta/vistoda-provider-kit
          ref: 9f0a48b39a184f1755a3cd051a26b4054c8a7541
          path: .ci/vistoda-provider-kit
      - name: Verify pinned Vistoda provider kit
        run: |
          pin="$(tr -d '[:space:]' < dependencies/vistoda-provider-kit.sha)"
          test "${pin}" = "9f0a48b39a184f1755a3cd051a26b4054c8a7541"
          test "$(git -C .ci/vistoda-provider-kit rev-parse HEAD)" = "${pin}"
          cmp .ci/vistoda-provider-kit/dist/vistoda-app-bootstrap.sh \
            packaging/home-assistant/vistoda-app-bootstrap.sh
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --test loc_budget
      - run: cargo test --locked --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - run: >-
          docker build --build-arg VERSION=0.2.0+ci --build-arg REVISION=ci
          --tag ezviz-vtm-bridge:test .
      - run: >-
          docker run --rm --network none --read-only --user 10001:10001
          ezviz-vtm-bridge:test --version
      - run: ./tests/smoke-remux.sh ezviz-vtm-bridge:test
