openapi: 3.1.0
info:
  title: EZVIZ VTM Bridge
  version: 1.5.0
  description: Internal bounded media contract for Home Assistant and SceneTrove.
servers: [{url: http://ezviz-vtm-bridge:8765}]
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Minimal liveness response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Low-cardinality Prometheus exposition
          content:
            text/plain:
              schema: {type: string}
  /v1/enrollments:
    post:
      summary: Start one bounded EZVIZ account enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account, password]
              properties:
                account: {type: string, minLength: 1}
                password: {type: string, minLength: 4}
                api_region: {type: string, default: eu}
      responses:
        "200":
          description: Enrollment completed or requires MFA
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Enrollment"}
        "409": {description: Another enrollment is active}
        "422": {description: EZVIZ rejected the credentials}
  /v1/enrollments/{enrollment_id}:
    parameters:
      - name: enrollment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Complete a single-use EZVIZ MFA challenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, pattern: "^[0-9]{6}$"}
      responses:
        "200": {description: Enrollment completed}
        "410": {description: Enrollment expired or was consumed}
        "422": {description: MFA code rejected}
    delete:
      summary: Cancel a pending enrollment
      security:
        - bearerAuth: []
      responses:
        "204": {description: Pending enrollment removed or already absent}
  /v1/cameras/{camera}/snapshot.jpg:
    get:
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Camera"
      responses:
        "200":
          description: Fresh or briefly coalesced JPEG snapshot
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            image/jpeg:
              schema: {type: string, contentEncoding: binary}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/cameras/{camera}/live.mpegps:
    get:
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Camera"
      responses:
        "200":
          description: Chunked canonical MPEG program stream for clear-media cameras
          content:
            video/mpeg:
              schema: {type: string, contentEncoding: binary}
        "409": {description: Camera exposes encrypted RTP and only the live.ts representation is available}
  /v1/cameras/{camera}/live.ts:
    get:
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Camera"
      responses:
        "200":
          description: Chunked shared copy-remuxed MPEG transport stream
          content:
            video/mp2t:
              schema: {type: string, contentEncoding: binary}
  /v1/cameras/{camera}/recordings:
    post:
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Camera"
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [duration_seconds]
              properties:
                duration_seconds: {type: integer, minimum: 1}
      responses:
        "202":
          description: Recording accepted or existing idempotent result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recording"}
  /v1/recordings:
    get:
      summary: List the bounded standalone Vistoda recording spool
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - {name: camera, in: query, schema: {type: string}}
      responses:
        "200":
          description: Recording manifests ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [recordings, pagination, storage]
                properties:
                  recordings:
                    type: array
                    items: {$ref: "#/components/schemas/Recording"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
                  storage: {$ref: "#/components/schemas/Storage"}
        "400":
          description: Page or page size is outside the bounded contract
  /v1/recordings/{recording_id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          description: Recording manifest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recording"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      summary: Acknowledge a locally committed recording
      description: >-
        Idempotently releases the bridge spool after the consumer has verified
        and durably committed the media. Unknown or already acknowledged IDs
        also return 204. Active recordings return 409 and are never removed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordingId"
      responses:
        "204":
          description: Recording spool released or already absent
        "409":
          description: Recording is still pending or recording
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string, const: recording_active}
  /v1/recordings/{recording_id}/media:
    get:
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordingId"
      responses:
        "200":
          description: Immutable MPEG-PS or MPEG-TS artifact as declared by its manifest
          content:
            video/mpeg:
              schema: {type: string, contentEncoding: binary}
            video/mp2t:
              schema: {type: string, contentEncoding: binary}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/recordings/{recording_id}/playback.mp4:
    get:
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/RecordingId"}]
      responses:
        "200":
          description: On-demand fragmented MP4 browser playback
          content:
            video/mp4:
              schema: {type: string, contentEncoding: binary}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    basicAuth:
      type: http
      scheme: basic
      description: Fixed username homeassistant; token is the password.
  parameters:
    Camera:
      name: camera
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9_-]+$"}
    RecordingId: {name: recording_id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
  schemas:
    Enrollment:
      type: object
      additionalProperties: false
      required: [enrollment_id, next_step, expires_in]
      properties:
        enrollment_id: {type: string, format: uuid}
        next_step: {type: string, enum: [otp, complete]}
        expires_in: {type: integer, minimum: 0, maximum: 120}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Recording:
      type: object
      additionalProperties: false
      required: [schema_version, recording_id, camera, status, requested_at, requested_duration_seconds, media_type]
      properties:
        schema_version: {type: integer, const: 1}
        recording_id: {type: string, format: uuid}
        camera: {type: string}
        status: {type: string, enum: [pending, recording, ready, failed]}
        requested_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        requested_duration_seconds: {type: integer}
        actual_duration_seconds: {type: [number, "null"]}
        media_type: {type: string, enum: [video/mpeg, video/mp2t]}
        bytes: {type: [integer, "null"]}
        sha256: {type: [string, "null"]}
        error_code: {type: [string, "null"]}
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages, has_previous, has_next]
      properties: {page: {type: integer, minimum: 1}, page_size: {type: integer, minimum: 1, maximum: 50}, total_items: {type: integer, minimum: 0}, total_pages: {type: integer, minimum: 1}, has_previous: {type: boolean}, has_next: {type: boolean}}
    Storage: {type: object, additionalProperties: false, required: [directory, scope, used_bytes, quota_bytes, available_bytes], properties: {directory: {type: string}, scope: {type: string, const: addon_private}, used_bytes: {type: integer, minimum: 0}, quota_bytes: {type: integer, minimum: 0}, available_bytes: {type: integer, minimum: 0}}}
  responses:
    NotFound:
      description: Resource is absent or not ready
security:
  - bearerAuth: []
